name: Release Build
on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: linux-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: macos-arm
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: macos-intel
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x64

    runs-on: ${{ matrix.os }}
    env:
      TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
      TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: { node-version: "22" }

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with: { version: "11" }

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}

      # ── Linux deps (Tauri + AppImage) ──
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      # ── Install streamlink (cada quien con su package manager) ──
      - name: Install streamlink (Linux)
        if: runner.os == 'Linux'
        run: sudo apt install -y streamlink

      - name: Install streamlink (macOS)
        if: runner.os == 'macOS'
        run: brew install streamlink

      - name: Install streamlink (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install streamlink 2>$null || winget install streamlink 2>$null || echo "Usando sidecar existente"

      # ── Frontend ──
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      # ── Rust backend (bundles específicos por plataforma) ──
      - name: Build Rust (Linux - deb + AppImage)
        if: runner.os == 'Linux'
        run: pnpm tauri build --target ${{ matrix.target }} --bundles deb,appimage

      - name: Rename Linux binaries + sigs
        if: runner.os == 'Linux'
        run: |
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          cd src-tauri/target/${{ matrix.target }}/release/bundle

          # Renombrar .deb
          for f in deb/*.deb; do
            mv "$f" "deb/BlinkStream_${VERSION}_Linux_x86_64.deb"
          done

          # Renombrar .AppImage
          for f in appimage/*.AppImage; do
            mv "$f" "appimage/BlinkStream_${VERSION}_Linux_x86_64.AppImage"
          done

          # Renombrar .sig files
          for f in deb/*.deb.sig appimage/*.AppImage.sig; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            case "$base" in
              *.deb.sig)
                mv "$f" "deb/BlinkStream_${VERSION}_Linux_x86_64.deb.sig"
                ;;
              *.AppImage.sig)
                mv "$f" "appimage/BlinkStream_${VERSION}_Linux_x86_64.AppImage.sig"
                ;;
            esac
          done

      - name: Build Rust (macOS - solo .app, sin DMG)
        if: runner.os == 'macOS'
        run: pnpm tauri build --target ${{ matrix.target }} --bundles app

      - name: Ad-hoc sign macOS .app (esencial para Gatekeeper)
        if: runner.os == 'macOS'
        run: |
          APP_PATH="src-tauri/target/${{ matrix.target }}/release/bundle/macos/BlinkStream.app"
          if [ -d "$APP_PATH" ]; then
            echo "🔏 Firmando app con ad-hoc signature..."
            codesign --force --deep --sign - "$APP_PATH"
            codesign -dv "$APP_PATH" 2>&1 | head -5
            echo "✅ App firmada correctamente"
          else
            echo "⚠️ App bundle no encontrado en $APP_PATH"
          fi

      - name: Create signed DMG from signed .app
        if: runner.os == 'macOS'
        run: |
          APP_PATH="src-tauri/target/${{ matrix.target }}/release/bundle/macos/BlinkStream.app"
          DMG_PATH="src-tauri/target/${{ matrix.target }}/release/bundle/dmg"
          mkdir -p "$DMG_PATH"
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          if [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then
            DMG_NAME="BlinkStream_${VERSION}_macOS_arm64.dmg"
          else
            DMG_NAME="BlinkStream_${VERSION}_macOS_x64.dmg"
          fi
          
          echo "📦 Creando DMG firmado..."
          hdiutil create -volname "BlinkStream" \
            -srcfolder "$APP_PATH" \
            -ov -format UDZO \
            "$DMG_PATH/$DMG_NAME"
          
          echo "✅ DMG creado: $DMG_NAME"

      - name: Generate macOS .sig for DMG
        if: runner.os == 'macOS'
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
        run: |
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          if [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then
            DMG_NAME="BlinkStream_${VERSION}_macOS_arm64.dmg"
          else
            DMG_NAME="BlinkStream_${VERSION}_macOS_x64.dmg"
          fi
          DMG_PATH="src-tauri/target/${{ matrix.target }}/release/bundle/dmg/$DMG_NAME"
          echo "🔏 Instalando minisign y generando signature..."
          brew install minisign
          echo "$TAURI_PRIVATE_KEY" > /tmp/tauri-key.minisign
          minisign -Sm "$DMG_PATH" -s /tmp/tauri-key.minisign
          mv "${DMG_PATH}.minisig" "${DMG_PATH}.sig"
          rm -f /tmp/tauri-key.minisign
          echo "✅ Signature: ${DMG_NAME}.sig"

      - name: Build Rust (Windows)
        if: runner.os == 'Windows'
        run: pnpm tauri build --target ${{ matrix.target }}

      - name: Rename Windows binaries + sigs
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $VERSION = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          cd src-tauri/target/${{ matrix.target }}/release/bundle

          # Renombrar .msi
          Get-ChildItem msi/*.msi | Rename-Item -NewName "BlinkStream_${VERSION}_Win_x64.msi"

          # Renombrar .exe (NSIS)
          Get-ChildItem nsis/*.exe | Rename-Item -NewName "BlinkStream_${VERSION}_Win_x64.exe"

          # Renombrar .sig files
          Get-ChildItem msi/*.msi.sig,nsis/*.exe.sig -ErrorAction SilentlyContinue | ForEach-Object {
            $ext = $_.Extension
            if ($_.Name -match '\.msi\.sig$') {
              Rename-Item $_ -NewName "BlinkStream_${VERSION}_Win_x64.msi.sig"
            } elseif ($_.Name -match '\.exe\.sig$') {
              Rename-Item $_ -NewName "BlinkStream_${VERSION}_Win_x64.exe.sig"
            }
          }

      # ── Upload artifacts (nombres únicos por target) ──
      - name: Upload Linux
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: BlinkStream-Linux-x86_64
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage

      - name: Upload macOS ARM
        if: matrix.artifact == 'macos-arm'
        uses: actions/upload-artifact@v4
        with:
          name: BlinkStream-macOS-arm64
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

      - name: Upload macOS Intel
        if: matrix.artifact == 'macos-intel'
        uses: actions/upload-artifact@v4
        with:
          name: BlinkStream-macOS-x64
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

      - name: Upload Windows
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: BlinkStream-Win-x64
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe

      # ── Upload a GitHub Release (SOLO en tags v*) ──
      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe

      # ── Upload .sig files for auto-updater ──
      - name: Upload signatures
        uses: actions/upload-artifact@v4
        with:
          name: signatures-${{ matrix.artifact }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.sig
          if-no-files-found: ignore

  # ── Generar updater.json con todas las signatures ──
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all signatures
        uses: actions/download-artifact@v4
        with:
          pattern: signatures-*
          merge-multiple: true

      - name: Build updater.json
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Construyendo updater.json para v$VERSION"

          # Template base
          cat > updater.json << EOF
          {
            "version": "$VERSION",
            "notes": "Novedades de BlinkStream v$VERSION",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {}
          }
          EOF

          # Función para añadir plataforma
          add_platform() {
            local platform="$1"
            local sig_file="$2"
            local url="$3"
            local sig=""

            if [ -f "$sig_file" ]; then
              sig=$(cat "$sig_file")
            fi

            # Usar node/jq para insertar en JSON
            node -e "
              const fs = require('fs');
              const data = JSON.parse(fs.readFileSync('updater.json', 'utf8'));
              data.platforms['$platform'] = {
                signature: '$sig',
                url: '$url'
              };
              fs.writeFileSync('updater.json', JSON.stringify(data, null, 2) + '\n');
            "
          }

          add_platform "windows-x86_64" \
            "BlinkStream_*.exe.sig" \
            "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/BlinkStream_${VERSION}_Win_x64.exe"

          add_platform "darwin-aarch64" \
            "BlinkStream_*.dmg.sig" \
            "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/BlinkStream_${VERSION}_macOS_arm64.dmg"

          add_platform "darwin-x86_64" \
            "BlinkStream_*.dmg.sig" \
            "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/BlinkStream_${VERSION}_macOS_x64.dmg"

          add_platform "linux-x86_64" \
            "BlinkStream_*.deb.sig" \
            "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/BlinkStream_${VERSION}_Linux_x86_64.deb"

          echo "updater.json generado:"
          cat updater.json

      - name: Upload updater.json to release
        uses: softprops/action-gh-release@v2
        with:
          files: updater.json

      - name: Commit updater.json to repo
        run: |
          git config user.name "BlinkStream Bot"
          git config user.email "bot@blinkstream.app"
          git add updater.json
          git diff --cached --exit-code || git commit -m "Update updater.json for v$VERSION"
          git push
