[package]
name = "blinkstream"
version = "1.3.0"
description = "BlinkStream - Cliente ultralight y de nueva generación de Twitch"
authors = ["BlinkStream Team"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.88.0"

[lib]
name = "blinkstream_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# `tokio` se usa para `task::spawn_blocking` dentro de comandos async de Tauri
# (mover llamadas síncronas largas como `run_streamlink_with_timeout` fuera
# del event loop). Tauri 2 ya depende transitivamente de tokio, pero
# necesitamos declararlo para usar `spawn_blocking` desde este crate.
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
tauri = { version = "2.11.2", features = ["devtools"] }
# FIX WT-20260628-77: habilitamos la feature "devtools" del propio
# crate tauri para que `devtools: true` en tauri.conf.json surta efecto
# en profile.release. En Tauri 2.x NO existe el crate separado
# `tauri-plugin-devtools`; los DevTools vienen built-in detrás de esta
# feature flag y NO requieren `.plugin(...)` en lib.rs.
tauri-plugin-log = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
wait-timeout = "0.2"
regex-lite = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
urlencoding = "2"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
# -------------------------------------------------
# Conditional dependencies — solo Unix
# -------------------------------------------------
[target.'cfg(not(windows))'.dependencies]
libc = "0.2"

# -------------------------------------------------
# Dev dependencies — solo `cargo test`
# -------------------------------------------------
# `tokio` ya viene como dep transitiva (reqwest/tauri), pero en modo test
# de la lib la resolución de crates no expone transitivas. Lo declaramos
# como dev-dependency con el subset mínimo necesario para que el código
# preexistente que usa `tokio::task::spawn_blocking` y `#[tokio::test]`
# compile en tests.
#
# WT-20260628-16: anadimos `macros` para que el test
# `get_app_token_missing_secret_returns_error` (que usa `#[tokio::test]`)
# compile. Antes dependia de una resolucion de features en cache, que
# se rompe con cualquier recompilacion. (`rt` ya estaba para el runtime
# basico; `macros` provee el macro `#[tokio::test]`.)
[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "macros"] }
