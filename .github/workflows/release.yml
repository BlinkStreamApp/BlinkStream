name: Release Build
on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: linux
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: macos-arm
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: macos-intel
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: { node-version: "20" }

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with: { version: "9" }

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with: { target: ${{ matrix.target }} }

      # ── Linux deps ──
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      # ── Frontend ──
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      # ── Rust backend ──
      - name: Build Rust
        working-directory: src-tauri
        run: cargo tauri build --target ${{ matrix.target }}

      # ── Upload artifacts ──
      - name: Upload Linux
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: BlinkStream-linux-x64
          path: src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb

      - name: Upload macOS ARM
        if: matrix.artifact == 'macos-arm'
        uses: actions/upload-artifact@v4
        with:
          name: BlinkStream-macos-arm
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

      - name: Upload macOS Intel
        if: matrix.artifact == 'macos-intel'
        uses: actions/upload-artifact@v4
        with:
          name: BlinkStream-macos-intel
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

      - name: Upload Windows
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: BlinkStream-windows-x64
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
