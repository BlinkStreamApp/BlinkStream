name: Release Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: "10" }

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with: { deno-version: "v2.x" }

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          components: rustfmt, clippy
          cache-workspaces: "src-tauri -> target"

      - name: Install Tauri test dependencies
        timeout-minutes: 8
        run: bash scripts/install-linux-build-deps.sh

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend lint
        run: pnpm lint

      - name: Frontend tests
        run: pnpm test

      - name: Dependency vulnerability checks
        run: |
          pnpm audit --prod
          python3 scripts/audit-rust-osv.py

      - name: Companion and refresh security regressions
        run: |
          node scripts/check-companion-security.mjs
          node supabase/functions/twitch-auth/_refresh-test.mjs

      - name: Release manifest tests
        run: pnpm test:release

      - name: Frontend build
        run: pnpm build

      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Rust lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: GLib security regression with release optimizations
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --test glib_variant_regression --release

      - name: OAuth security tests
        run: node supabase/functions/twitch-auth/_security-test.mjs

      - name: Edge Function tests
        run: deno test --node-modules-dir=auto --allow-env --allow-read --allow-net supabase/functions/twitch-auth/index.test.ts supabase/functions/blinkstream-data/index.test.ts

  build:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: linux-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: macos-arm
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: macos-intel
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: "10" }

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          target: ${{ matrix.target }}
          cache-workspaces: "src-tauri -> target"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: bash scripts/install-linux-build-deps.sh

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Linux bundles
        if: runner.os == 'Linux'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: node scripts/build-signed-release.mjs --target ${{ matrix.target }} --bundles deb,appimage

      - name: Rename Linux bundles
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          BUNDLE="src-tauri/target/${{ matrix.target }}/release/bundle"

          DEB=$(find "$BUNDLE/deb" -maxdepth 1 -type f -name '*.deb' -print -quit)
          APPIMAGE=$(find "$BUNDLE/appimage" -maxdepth 1 -type f -name '*.AppImage' -print -quit)
          test -n "$DEB" && test -n "$APPIMAGE" && test -f "$APPIMAGE.sig"

          mv "$DEB" "$BUNDLE/deb/BlinkStream_${VERSION}_Linux_x86_64.deb"
          if [ -f "$DEB.sig" ]; then
            mv "$DEB.sig" "$BUNDLE/deb/BlinkStream_${VERSION}_Linux_x86_64.deb.sig"
          fi
          mv "$APPIMAGE" "$BUNDLE/appimage/BlinkStream_${VERSION}_Linux_x86_64.AppImage"
          if [ -f "$APPIMAGE.sig" ]; then
            mv "$APPIMAGE.sig" "$BUNDLE/appimage/BlinkStream_${VERSION}_Linux_x86_64.AppImage.sig"
          fi

      - name: Build macOS bundles
        if: runner.os == 'macOS'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: node scripts/build-signed-release.mjs --target ${{ matrix.target }} --bundles app,dmg

      - name: Rename macOS bundles
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          BUNDLE="src-tauri/target/${{ matrix.target }}/release/bundle"
          if [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then
            ARCH=arm64
          else
            ARCH=x64
          fi

          ARCHIVE=$(find "$BUNDLE/macos" -maxdepth 1 -type f -name '*.app.tar.gz' -print -quit)
          DMG=$(find "$BUNDLE/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)
          test -n "$ARCHIVE" && test -f "$ARCHIVE.sig"
          test -n "$DMG"

          mv "$ARCHIVE" "$BUNDLE/macos/BlinkStream_${VERSION}_macOS_${ARCH}.app.tar.gz"
          mv "$ARCHIVE.sig" "$BUNDLE/macos/BlinkStream_${VERSION}_macOS_${ARCH}.app.tar.gz.sig"
          mv "$DMG" "$BUNDLE/dmg/BlinkStream_${VERSION}_macOS_${ARCH}.dmg"

      - name: Build Windows bundles
        if: runner.os == 'Windows'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: node scripts/build-signed-release.mjs --target ${{ matrix.target }} --bundles msi,nsis

      - name: Rename Windows bundles
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $bundle = "src-tauri/target/${{ matrix.target }}/release/bundle"
          $msi = @(Get-ChildItem "$bundle/msi/*.msi")
          $nsis = @(Get-ChildItem "$bundle/nsis/*.exe")
          if ($msi.Count -ne 1 -or $nsis.Count -ne 1) { throw "Expected exactly one MSI and one NSIS bundle" }
          if (-not (Test-Path "$($nsis[0].FullName).sig")) { throw "Missing NSIS updater signature" }

          Rename-Item -LiteralPath $msi[0].FullName -NewName "BlinkStream_${version}_Win_x64.msi"
          if (Test-Path "$($msi[0].FullName).sig") {
            Rename-Item -LiteralPath "$($msi[0].FullName).sig" -NewName "BlinkStream_${version}_Win_x64.msi.sig"
          }
          Rename-Item -LiteralPath $nsis[0].FullName -NewName "BlinkStream_${version}_Win_x64.exe"
          if (Test-Path "$($nsis[0].FullName).sig") {
            Rename-Item -LiteralPath "$($nsis[0].FullName).sig" -NewName "BlinkStream_${version}_Win_x64.exe.sig"
          }

      - name: Smoke test signed Windows installer and updater mode
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          ./scripts/test-windows-installer.ps1 -Installer "src-tauri/target/${{ matrix.target }}/release/bundle/nsis/BlinkStream_${version}_Win_x64.exe"

      - name: Upload Linux artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BlinkStream-Linux-x86_64
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb*
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage*

      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BlinkStream-${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz*

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BlinkStream-Win-x64
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi*
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }

      - name: Download signed platform artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: BlinkStream-*
          path: release-artifacts

      - name: Verify every artifact and build updater manifest
        id: release_metadata
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          TAG="v$VERSION"
          NOTES="docs/releases/${VERSION}.md"
          test -f "$NOTES"
          printf 'notes=%s\n' "$NOTES" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then TAG="$GITHUB_REF_NAME"; fi
          node scripts/build-updater-manifest.mjs \
            --version "$VERSION" \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$TAG" \
            --artifacts release-artifacts \
            --config src-tauri/tauri.conf.json \
            --notes "$NOTES" \
            --output updater.json

      - name: Upload verified manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-updater-manifest
          path: updater.json
          if-no-files-found: error

      - name: Checkout manifest branch
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: master
          path: manifest-branch

      - name: Check publication still matches master
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const release = JSON.parse(readFileSync("src-tauri/tauri.conf.json"));
            const master = JSON.parse(readFileSync("manifest-branch/src-tauri/tauri.conf.json"));
            if (`v${master.version}` !== process.env.GITHUB_REF_NAME ||
                master.plugins.updater.pubkey !== release.plugins.updater.pubkey) {
              throw new Error("Master changed version or updater trust; publication blocked");
            }
          '

      - name: Stage complete release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          body_path: ${{ steps.release_metadata.outputs.notes }}
          fail_on_unmatched_files: true
          files: |
            updater.json
            release-artifacts/**/*.exe
            release-artifacts/**/*.msi
            release-artifacts/**/*.deb
            release-artifacts/**/*.AppImage
            release-artifacts/**/*.dmg
            release-artifacts/**/*.app.tar.gz
            release-artifacts/**/*.sig

      - name: Publish validated release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest

      - name: Commit updater manifest
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          # Fail closed if master advanced to a different version during this tag build.
          VERSION=$(node -p "require('./manifest-branch/src-tauri/tauri.conf.json').version")
          test "v$VERSION" = "$GITHUB_REF_NAME"
          cp updater.json manifest-branch/updater.json
          cd manifest-branch
          git config user.name "BlinkStream Bot"
          git config user.email "bot@blinkstream.app"
          git add updater.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): update updater.json for ${GITHUB_REF_NAME} [skip ci]"
            git push origin HEAD:master
          fi
