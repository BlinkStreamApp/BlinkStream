name: Updater signing key diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-key:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Verify and prepare official Minisign utility
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            import { join } from "node:path";
            import { verifyUpdaterArtifact } from "./scripts/build-updater-manifest.mjs";
            const url = "https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz";
            const [binary, detached] = await Promise.all([url, `${url}.minisig`].map(
              address => fetch(address, { signal: AbortSignal.timeout(60000) })));
            if (!binary.ok || !detached.ok) throw new Error("Minisign download failed");
            const bytes = Buffer.from(await binary.arrayBuffer());
            const signature = Buffer.from(await detached.text()).toString("base64");
            const publicKey = Buffer.from("untrusted comment: Minisign release key\n" +
              "RWQf6LRCGA9i53mlYecO4IzT51TGPpvWucNSCh1CBM0QTaLn73Y7GFO3\n").toString("base64");
            verifyUpdaterArtifact(bytes, signature, publicKey);
            writeFileSync(join(process.env.RUNNER_TEMP, "minisign.tar.gz"), bytes);
          '
          tar -xzf "$RUNNER_TEMP/minisign.tar.gz" -C "$RUNNER_TEMP" minisign-linux/x86_64/minisign
          chmod 700 "$RUNNER_TEMP/minisign-linux/x86_64/minisign"
          echo "$RUNNER_TEMP/minisign-linux/x86_64" >> "$GITHUB_PATH"
      - name: Recover public key and verify probe
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: node scripts/recover-updater-public-key.mjs public-key-evidence
      - name: Upload public evidence only
        uses: actions/upload-artifact@v4
        with:
          name: updater-public-key-evidence
          retention-days: 7
          if-no-files-found: error
          path: |
            public-key-evidence/updater.pub
            public-key-evidence/probe.txt
            public-key-evidence/probe.txt.sig
