name: Release Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: { node-version: "22" }

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with: { version: "10" }

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with: { deno-version: "v2.x" }

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy

      - name: Install Tauri test dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend lint
        run: pnpm lint

      - name: Frontend tests
        run: pnpm test

      - name: Release manifest tests
        run: pnpm test:release

      - name: Frontend build
        run: pnpm build

      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Rust lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: OAuth security tests
        run: node supabase/functions/twitch-auth/_security-test.mjs

      - name: Edge Function tests
        run: deno test --node-modules-dir=auto --allow-env --allow-read --allow-net supabase/functions/twitch-auth/index.test.ts supabase/functions/blinkstream-data/index.test.ts

  build:
    needs: quality
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: linux-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: macos-arm
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: macos-intel
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x64

    runs-on: ${{ matrix.os }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: { node-version: "22" }

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with: { version: "10" }

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Linux bundles
        if: runner.os == 'Linux'
        run: pnpm tauri build --config src-tauri/tauri.release.conf.json --target ${{ matrix.target }} --bundles deb,appimage

      - name: Rename Linux bundles
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          BUNDLE="src-tauri/target/${{ matrix.target }}/release/bundle"

          DEB=$(find "$BUNDLE/deb" -maxdepth 1 -type f -name '*.deb' -print -quit)
          APPIMAGE=$(find "$BUNDLE/appimage" -maxdepth 1 -type f -name '*.AppImage' -print -quit)
          UPDATER=$(find "$BUNDLE/appimage" -maxdepth 1 -type f -name '*.AppImage.tar.gz' -print -quit)
          test -n "$DEB" && test -n "$APPIMAGE"

          mv "$DEB" "$BUNDLE/deb/BlinkStream_${VERSION}_Linux_x86_64.deb"
          if [ -f "$DEB.sig" ]; then
            mv "$DEB.sig" "$BUNDLE/deb/BlinkStream_${VERSION}_Linux_x86_64.deb.sig"
          fi
          mv "$APPIMAGE" "$BUNDLE/appimage/BlinkStream_${VERSION}_Linux_x86_64.AppImage"
          if [ -f "$APPIMAGE.sig" ]; then
            mv "$APPIMAGE.sig" "$BUNDLE/appimage/BlinkStream_${VERSION}_Linux_x86_64.AppImage.sig"
          fi

      - name: Build macOS bundles
        if: runner.os == 'macOS'
        run: pnpm tauri build --config src-tauri/tauri.release.conf.json --target ${{ matrix.target }} --bundles app,dmg

      - name: Rename macOS bundles
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          BUNDLE="src-tauri/target/${{ matrix.target }}/release/bundle"
          if [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then
            ARCH=arm64
          else
            ARCH=x64
          fi

          ARCHIVE=$(find "$BUNDLE/macos" -maxdepth 1 -type f -name '*.app.tar.gz' -print -quit)
          DMG=$(find "$BUNDLE/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)
          test -n "$ARCHIVE" && test -f "$ARCHIVE.sig"
          test -n "$DMG"

          mv "$ARCHIVE" "$BUNDLE/macos/BlinkStream_${VERSION}_macOS_${ARCH}.app.tar.gz"
          mv "$ARCHIVE.sig" "$BUNDLE/macos/BlinkStream_${VERSION}_macOS_${ARCH}.app.tar.gz.sig"
          mv "$DMG" "$BUNDLE/dmg/BlinkStream_${VERSION}_macOS_${ARCH}.dmg"

      - name: Build Windows bundles
        if: runner.os == 'Windows'
        run: pnpm tauri build --config src-tauri/tauri.release.conf.json --target ${{ matrix.target }} --bundles msi,nsis

      - name: Rename Windows bundles
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $bundle = "src-tauri/target/${{ matrix.target }}/release/bundle"
          $msi = @(Get-ChildItem "$bundle/msi/*.msi")
          $nsis = @(Get-ChildItem "$bundle/nsis/*.exe")
          if ($msi.Count -ne 1 -or $nsis.Count -ne 1) { throw "Expected exactly one MSI and one NSIS bundle" }
          if (-not (Test-Path "$($nsis[0].FullName).sig")) { throw "Missing NSIS updater signature" }

          Rename-Item -LiteralPath $msi[0].FullName -NewName "BlinkStream_${version}_Win_x64.msi"
          if (Test-Path "$($msi[0].FullName).sig") {
            Rename-Item -LiteralPath "$($msi[0].FullName).sig" -NewName "BlinkStream_${version}_Win_x64.msi.sig"
          }
          Rename-Item -LiteralPath $nsis[0].FullName -NewName "BlinkStream_${version}_Win_x64.exe"
          if (Test-Path "$($nsis[0].FullName).sig") {
            Rename-Item -LiteralPath "$($nsis[0].FullName).sig" -NewName "BlinkStream_${version}_Win_x64.exe.sig"
          }

          if (Test-Path "src-tauri/target/${{ matrix.target }}/release/blinkstream.exe") {
            Copy-Item "src-tauri/target/${{ matrix.target }}/release/blinkstream.exe" -Destination "$bundle/nsis/BlinkStream-Setup_${version}_Custom.exe"
          }

      - name: Upload Linux artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: BlinkStream-Linux-x86_64
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb*
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage*

      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: BlinkStream-${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz*

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: BlinkStream-Win-x64
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi*
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe*

      - name: Publish Linux release assets
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Linux'
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage

      - name: Publish macOS release assets
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'macOS'
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz

      - name: Publish Windows release assets
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/*_Custom.exe

      - name: Upload updater signatures
        uses: actions/upload-artifact@v4
        with:
          name: signatures-${{ matrix.artifact }}
          if-no-files-found: warn
          path: src-tauri/target/${{ matrix.target }}/release/bundle/**/*.sig

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Download updater signatures
        uses: actions/download-artifact@v4
        with:
          pattern: signatures-*
          path: release-signatures

      - name: Build updater manifest
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/build-updater-manifest.mjs \
            --version "$VERSION" \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --artifacts release-signatures \
            --notes RELEASE_NOTES.md \
            --output updater.json

      - name: Publish updater manifest
        if: false
        uses: softprops/action-gh-release@v2
        with:
          files: updater.json

      - name: Commit updater manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "BlinkStream Bot"
          git config user.email "bot@blinkstream.app"
          git add updater.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): update updater.json for ${GITHUB_REF_NAME} [skip ci]"
            git push origin HEAD:master
          fi
