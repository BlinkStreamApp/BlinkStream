name: Release Build
on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: linux-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: macos-arm
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: macos-intel
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: { node-version: "22" }

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with: { version: "11" }

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}

      # ── Linux deps (Tauri + AppImage) ──
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      # ── Install streamlink (cada quien con su package manager) ──
      - name: Install streamlink (Linux)
        if: runner.os == 'Linux'
        run: sudo apt install -y streamlink

      - name: Install streamlink (macOS)
        if: runner.os == 'macOS'
        run: brew install streamlink

      - name: Install streamlink (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install streamlink 2>$null || winget install streamlink 2>$null || echo "Usando sidecar existente"

      # ── Frontend ──
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      # ── Rust backend (bundles específicos por plataforma) ──
      - name: Build Rust (Linux - deb + AppImage)
        if: runner.os == 'Linux'
        run: pnpm tauri build --target ${{ matrix.target }} --bundles deb,appimage

      - name: Build Rust (macOS)
        if: runner.os == 'macOS'
        run: pnpm tauri build --target ${{ matrix.target }}

      - name: Build Rust (Windows)
        if: runner.os == 'Windows'
        run: pnpm tauri build --target ${{ matrix.target }}

      # ── Upload artifacts (nombres únicos por target) ──
      - name: Upload Linux
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: BlinkStream-linux-x64
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage

      - name: Upload macOS ARM
        if: matrix.artifact == 'macos-arm'
        uses: actions/upload-artifact@v4
        with:
          name: BlinkStream-macos-arm
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

      - name: Upload macOS Intel
        if: matrix.artifact == 'macos-intel'
        uses: actions/upload-artifact@v4
        with:
          name: BlinkStream-macos-intel
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

      - name: Upload Windows
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: BlinkStream-windows-x64
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe

      # ── Upload a GitHub Release (SOLO en tags v*) ──
      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
